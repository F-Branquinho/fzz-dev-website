<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f3b"/>
      <stop offset="1" stop-color="#0d0f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#5865f2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5865f2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>
  <circle cx="320" cy="170" r="190" fill="url(#glow)"/>

  <!-- chat bubbles -->
  <g opacity=".9">
    <rect x="48" y="70" width="150" height="34" rx="17" fill="#2b2f55"/>
    <rect x="64" y="83" width="86" height="8" rx="4" fill="#8f97ff"/>
    <rect x="442" y="232" width="150" height="34" rx="17" fill="#2b2f55"/>
    <rect x="458" y="245" width="110" height="8" rx="4" fill="#8f97ff"/>
    <rect x="452" y="88" width="120" height="30" rx="15" fill="#ff5500" opacity=".85"/>
    <text x="512" y="108" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">/help</text>
    <rect x="66" y="246" width="120" height="30" rx="15" fill="#ff5500" opacity=".85"/>
    <text x="126" y="266" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">/play</text>
  </g>

  <!-- robot -->
  <g transform="translate(320 178)">
    <line x1="0" y1="-92" x2="0" y2="-70" stroke="#c7ccff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-98" r="10" fill="#ff5500"/>
    <rect x="-88" y="-70" width="176" height="130" rx="34" fill="#5865f2"/>
    <rect x="-70" y="-50" width="140" height="80" rx="22" fill="#11132a"/>
    <circle cx="-30" cy="-12" r="13" fill="#7cf3ff"/>
    <circle cx="30" cy="-12" r="13" fill="#7cf3ff"/>
    <path d="M-22 14 Q0 28 22 14" stroke="#7cf3ff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="-104" y="-30" width="16" height="44" rx="8" fill="#4752c4"/>
    <rect x="88" y="-30" width="16" height="44" rx="8" fill="#4752c4"/>
  </g>
</svg>
